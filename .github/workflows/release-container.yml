name: "Build: Release Container"

# oneICT fork (oneictag/CIPP-NG). Replaces the upstream release workflow: builds the image from a
# release tag on the `oneict` branch (upstream release + oneICT commits) and pushes it to
# ghcr.io/oneictag/cipp-ng. The file path, the tag ref and the attestation must stay like this:
# CIPP's built-in container updater (Test-CIPPContainerAttestation) only accepts a :latest image
# that was built by .github/workflows/release-container.yml from refs/tags/* in the repository
# named by the image path.
#
# Started by oneict-upstream.yml (workflow_dispatch is allowed for GITHUB_TOKEN) or by hand:
#   gh workflow run release-container.yml --ref v11.4.0+oneict.1 -f promote=false
# promote=false builds only the version tag (staging); promote=true also moves :latest, which every
# instance pointing at ghcr.io/oneictag/cipp-ng:latest picks up at its next update check.

on:
  workflow_dispatch:
    inputs:
      promote:
        description: "Also tag :latest (production instances auto-update to it)"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

concurrency:
  group: release-container
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Require a oneICT release tag
        run: |
          case "${GITHUB_REF}" in
            refs/tags/v*+oneict.*) ;;
            *) echo "::error::Run this on a tag like v11.4.0+oneict.1, not ${GITHUB_REF}"; exit 1 ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only commits that reached the oneict branch may become an image.
      - name: Verify tag is on oneict
        run: |
          git fetch --no-tags origin oneict
          git merge-base --is-ancestor HEAD origin/oneict || {
            echo "::error::Tag ${GITHUB_REF_NAME} is not an ancestor of oneict; refusing to build"
            exit 1
          }

      - name: Names and version
        id: version
        env:
          REPO: ${{ github.repository }}
        run: |
          # v11.4.0+oneict.3 -> APP_VERSION 11.4.0+oneict.3 (semver build metadata: compares equal to
          # 11.4.0, so no false "out of date" alerts) and image tag 11.4.0-oneict.3 (no '+' in tags)
          TAG="${GITHUB_REF_NAME#v}"
          echo "IMAGE_NAME_LC=${REPO,,}" >> $GITHUB_ENV
          echo "app_version=$TAG" >> $GITHUB_OUTPUT
          echo "image_tag=${TAG//+/-}" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/Dockerfile.release
          push: true
          cache-from: type=gha,scope=oneict-release
          cache-to: type=gha,mode=max,scope=oneict-release
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
            COMMIT_SHA=${{ github.sha }}
            IMAGE_TAG=latest
            BUILD_DATE=${{ steps.version.outputs.build_date }}
            DOTNET_REGISTRY=ghcr.io/cyberdrain
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ steps.version.outputs.image_tag }}
            ${{ inputs.promote && format('{0}/{1}:latest', env.REGISTRY, env.IMAGE_NAME_LC) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=CIPP - CIPP Next Generation (oneICT build)
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.app_version }}
            org.opencontainers.image.created=${{ steps.version.outputs.build_date }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "### ${{ env.IMAGE_NAME_LC }}:${{ steps.version.outputs.image_tag }}"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- APP_VERSION: ${{ steps.version.outputs.app_version }}"
            echo "- :latest moved: ${{ inputs.promote }}"
          } >> $GITHUB_STEP_SUMMARY
